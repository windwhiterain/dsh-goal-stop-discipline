# dsh-goal-stop-discipline bundle patch: inserts the discipline row.
#
# `goalToolsOnDemand` masks get_goal / create_goal / update_goal on every agent
# while that agent holds no goal, and again once its goal is complete. A paused
# or blocked goal keeps the tools: `update_goal` is what moves the goal out of
# those phases, so a mask there removed the tool the round had just been told to
# call. That needs the tools to be published by the composition in the first
# place: a preset that mounts no goal tool has nothing to mask. Set
# `goalToolsOnDemand` to false to leave tool visibility to the composition.
#
# `policyText` renders while the assembling agent holds an active goal, and
# `roundNoticeText` is appended to the first step of every goal round; each has a
# `...WithoutGoalTools` variant for a preset that publishes none. Set
# `policyEnabled` or `roundNoticeEnabled` to false to drop one half of the row.
#
# `askEnabled` appends the ask rule — call `ask_user_question` and wait for the
# answer instead of writing a question into the message, where the user never
# sees it and the next round starts without it — to whichever text the scope
# gets. It is appended only to a scope that can actually call `ask_user_question`,
# so a preset that mounts no question tool is told nothing about asking. It rides
# in the same notice message and paragraph, so it costs no extra message. Set
# `askEnabled` to false to drop it.
#
# `compactEnabled` publishes the model-facing `compact_context` tool, and appends
# its nudge to the per-round notice only where that tool, a compaction backend,
# and the token meter all resolve for the agent. The tool replaces a balanced
# prefix of the session history with a summary while the round is running, so a
# long goal can make room without waiting for the pressure threshold or for the
# turn to end. `compactRetainRatio` is the fraction of the measured context kept
# verbatim below the compacted prefix. Set `compactEnabled` to false to drop both
# the tool and the nudge.
#
# `compactGaugeEnabled` prepends the measured context gauge to that nudge, so the
# model reads the used, window, remaining, and percent numbers instead of
# guessing. `compactGaugeText` is the template and must contain `{used}`,
# `{window}`, `{remaining}`, and `{percent}`. A route whose model declares no
# window leaves the gauge out and keeps the nudge. Set `compactGaugeEnabled` to
# false to drop the number and keep the instruction.
#
# Every text is plain model-facing text: write them as instructions to the agent,
# and keep any house rule that belongs with them here rather than in the row's
# code.
- insert:
    - id: goal-stop-discipline
      name: 'dsh-goal-stop-discipline'
      config:
        goalToolsOnDemand: true
        policyEnabled: true
        roundNoticeEnabled: true
        askEnabled: true
        compactEnabled: true
        compactGaugeEnabled: true
        compactRetainRatio: 0.2